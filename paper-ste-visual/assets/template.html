<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#eef2f6; --surface:#ffffff; --ink:#14213d; --muted:#53647c; --line:#cdd7e3;
  --teal:#0b7f81; --teal-soft:#d5eeee; --amber:#d98a12; --amber-soft:#fbebcc;
  --idle:#e6ebf1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1726; --surface:#172238; --ink:#e8eef7; --muted:#9db0c9; --line:#2b3a55;
    --teal:#47c6c8; --teal-soft:#12393d; --amber:#f0b44f; --amber-soft:#3e3219; --idle:#1d2b45;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1726; --surface:#172238; --ink:#e8eef7; --muted:#9db0c9; --line:#2b3a55;
  --teal:#47c6c8; --teal-soft:#12393d; --amber:#f0b44f; --amber-soft:#3e3219; --idle:#1d2b45;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  font-size:1.0625rem;line-height:1.6;
}
main{max-width:1080px;margin:0 auto;padding:2rem 1.25rem 4rem}
header{margin-bottom:2.5rem}
h1{font-size:clamp(2rem,6vw,3.25rem);line-height:1.08;margin:0 0 .5rem;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 1.25rem;max-width:56ch}
.bar{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;align-items:center;padding:.75rem 1rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:.95rem}
.bar label{display:inline-flex;gap:.5rem;align-items:center;min-height:44px;cursor:pointer}
.bar input{width:1.1rem;height:1.1rem;accent-color:var(--teal)}
.langs{display:flex;flex-wrap:wrap;gap:.4rem}
#stats{color:var(--muted)}

section{margin-top:3rem}
h2{font-size:1.75rem;margin:0 0 1.25rem;letter-spacing:-.01em}
.grid{display:grid;gap:1.75rem}
@media (min-width:900px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:start}}

.prose p{margin:0 0 1.1rem;max-width:62ch}
.prose .s{display:inline}
.term{font-weight:700;background:linear-gradient(transparent 62%,var(--teal-soft) 62%)}
.wc{
  font-size:.68rem;line-height:1;font-weight:700;color:var(--teal);border:1px solid currentColor;
  border-radius:999px;padding:.12em .42em;margin:0 .35em 0 .25em;vertical-align:.45em;white-space:nowrap
}
.wc.over{color:var(--amber)}
body.nocount .wc{display:none}

/* language modes */
body[data-lang="en"] .zh-p{display:none}
body[data-lang="zh"] .en-p{display:none}
body[data-lang="zh"] .wc,
body[data-lang="zh"] .countwrap{display:none}
body[data-lang="both"] .prose .en-p{margin-bottom:.35rem}
body[data-lang="both"] .prose .zh-p{
  color:var(--muted);font-size:.98rem;padding-left:.8rem;border-left:3px solid var(--teal-soft);margin-bottom:1.5rem
}

.widget{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.25rem}
.widget h3{margin:0 0 .25rem;font-size:1.15rem}
.hint{color:var(--muted);font-size:.92rem;margin:0 0 1rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 1rem}
.chip{
  font:inherit;font-size:1rem;padding:.3rem .65rem;border-radius:7px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);line-height:1.3
}
.chip.new{background:var(--amber-soft);border-color:var(--amber)}
.chip.end{background:var(--idle);color:var(--muted);font-style:italic}
button.chip{cursor:pointer;min-height:44px}
button.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.chip[aria-pressed="true"]{color:#08202a}}
:root[data-theme="dark"] button.chip[aria-pressed="true"]{color:#08202a}

.cands{display:grid;gap:.4rem;margin:0 0 .75rem;min-height:9.5rem;align-content:start}
.cand{display:grid;grid-template-columns:5.5rem 1fr 3rem;gap:.6rem;align-items:center;font-size:.95rem}
.cand .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:.9rem;background:var(--idle);border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--teal);border-radius:5px;transition:width .35s ease}
.cand.top .fill{background:var(--amber)}
.cand .pct{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.cap{margin:0 0 1rem;min-height:3.2em;color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:.6rem}
button.btn{
  font:inherit;font-weight:700;min-height:44px;padding:.5rem 1.1rem;border-radius:8px;cursor:pointer;
  border:1px solid var(--teal);background:var(--teal);color:#fff
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.btn{color:#08202a}}
:root[data-theme="dark"] button.btn{color:#08202a}
button.btn.ghost{background:transparent;color:var(--teal)}
button.btn:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.split{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin:0 0 1rem}
.split .chip{font-size:.95rem}
.split .tag{font-size:.9rem;color:var(--muted);margin-right:.5rem}
.p1{background:var(--teal-soft)} .p2{background:var(--amber-soft)}

.modes{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 1rem}
.router{
  border:1px dashed var(--teal);border-radius:10px;padding:.55rem .8rem;margin:0 0 .75rem;
  display:flex;justify-content:space-between;gap:.75rem;flex-wrap:wrap;font-size:.95rem;background:var(--teal-soft)
}
.experts{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin:0 0 .9rem}
.ex{
  border-radius:9px;padding:.6rem .4rem;text-align:center;background:var(--idle);color:var(--muted);
  border:1px solid transparent;transition:background .25s,color .25s,border-color .25s;min-height:4.4rem
}
.ex b{display:block;font-size:1.05rem}
.ex span{font-size:.85rem}
.ex.on{background:var(--amber-soft);color:var(--ink);border-color:var(--amber)}
.read{margin:0;font-size:.97rem}
.read strong{font-variant-numeric:tabular-nums}

.diagram{margin:1.5rem 0 0;max-width:460px}
.diagram svg{width:100%;height:auto;display:block}
.diagram figcaption{color:var(--muted);font-size:.92rem;margin-top:.5rem;max-width:56ch}
.d-box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.d-box.teal{fill:var(--teal-soft);stroke:var(--teal)}
.d-box.dash{fill:var(--teal-soft);stroke:var(--teal);stroke-dasharray:5 4}
.d-box.idle{fill:var(--idle);stroke:none}
.d-box.on{fill:var(--amber-soft);stroke:var(--amber);stroke-width:2}
.d-chip{fill:var(--bg);stroke:var(--line)}
.d-t{fill:var(--ink);font-weight:700;font-size:13px}
.d-s{fill:var(--muted);font-size:12px}
.d-s.sm{font-size:11px}
.d-arrow{stroke:var(--muted);stroke-width:1.6;fill:none}
.d-head{fill:var(--muted)}
.d-node{fill:var(--teal)}
.d-link{stroke:var(--teal);stroke-opacity:.35;stroke-width:1}
.d-bar{fill:var(--teal)}
.d-bar.top{fill:var(--amber)}
.d-sel{stroke:var(--amber);stroke-width:2.5;fill:none}
.d-idle{stroke:var(--muted);stroke-opacity:.5;stroke-dasharray:3 3;fill:none}

.d-box.act{stroke:var(--amber);stroke-width:2.5}
.d-chip.act{fill:var(--amber-soft);stroke:var(--amber)}
.d-node.act{fill:var(--amber)}
.d-arrow.act{stroke:var(--amber);stroke-width:2.5}
.d-dot{fill:var(--amber);stroke:var(--surface);stroke-width:2}
.anim-ctl{display:flex;gap:.6rem;align-items:center;margin-top:.6rem;flex-wrap:wrap}
.stage{margin:.5rem 0 0;font-weight:700;min-height:3.2em;max-width:56ch}

section h3.tbl-h{margin:2rem 0 .75rem;font-size:1.2rem}
.tbl{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.tbl table{width:100%;border-collapse:collapse;font-size:.97rem}
.tbl th{text-align:left;background:var(--teal-soft);padding:.6rem .85rem;font-size:.9rem}
.tbl td{padding:.7rem .85rem;border-top:1px solid var(--line);vertical-align:top}
.tbl .tm{font-weight:700;min-width:8rem}
.tbl .tm .t-zh{display:block;font-weight:400;font-size:.88rem;color:var(--muted)}
.tbl .avoid{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--amber);text-decoration-thickness:2px}
body[data-lang="en"] .t-zh,
body[data-lang="en"] .col-zh{display:none}
body[data-lang="zh"] .col-en{display:none}
@media (max-width:700px){
  .tbl{border:0;background:transparent;border-radius:0}
  .tbl thead{display:none}
  .tbl table,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{border:1px solid var(--line);border-radius:10px;padding:.55rem .85rem;margin-bottom:.7rem;background:var(--surface)}
  .tbl td{border:0;padding:.3rem 0}
  .tbl td[data-label]::before{content:attr(data-label);display:block;font-size:.8rem;color:var(--muted)}
  .tbl .tm{min-width:0}
}

footer{margin-top:3.5rem;padding-top:1.5rem;border-top:1px solid var(--line);color:var(--muted);max-width:68ch}
footer p{margin:0 0 .8rem}

@media (max-width:520px){
  .cand{grid-template-columns:4.2rem 1fr 2.8rem}
  .experts{grid-template-columns:repeat(4,1fr);gap:.35rem}
  .widget{padding:1rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- paper-ste-visual additions ---- */
.L-zh{display:none}
body[data-lang="zh"] .L-en{display:none}
body[data-lang="zh"] .L-zh{display:inline}
body[data-lang="both"] .L-en{display:block}
body[data-lang="both"] .L-zh{display:block;color:var(--muted);font-size:.92em;font-weight:400}
h1 .L-zh,h2 .L-zh,h3 .L-zh{font-size:.58em;margin-top:.2rem}
.srcline{color:var(--muted);font-size:.92rem;margin:0 0 1.1rem;max-width:72ch}
.srcline a{color:var(--teal)}
.grid.single{grid-template-columns:minmax(0,1fr)}
.d-box.act{stroke:var(--amber);stroke-width:3;filter:drop-shadow(0 0 5px var(--amber))}
@media (min-width:900px){.figcol{position:sticky;top:calc(1rem + env(safe-area-inset-top,0px))}}
.figcol .diagram{margin-top:0}
.scen{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 .6rem}
g.node.dim,path.d-arrow.dim,text.elabel.dim{opacity:.25}
.chart .cand{grid-template-columns:7.2rem 1fr 4.8rem}
.chart .src{color:var(--muted);font-size:.88rem;margin:.5rem 0 0}
.chart .hint{margin-bottom:.6rem}
@media (max-width:520px){.chart .cand{grid-template-columns:5.6rem 1fr 4.4rem}}

/* figure cards */
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.25rem;margin:0 0 1.75rem}
.fhead{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .6rem;margin:0 0 1rem}
.fhead h3{margin:0 0 0 .3rem;font-size:1.25rem}
.fid{display:inline-block;background:var(--teal);color:#fff;border-radius:6px;padding:.05rem .5rem;font-weight:700;font-size:.88rem}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fid{color:#08202a}}
:root[data-theme="dark"] .fid{color:#08202a}
body[data-lang="en"] .fid-zh{display:none}
body[data-lang="zh"] .fid-en{display:none}
.fgrid{display:grid;gap:1.25rem}
@media (min-width:900px){.fgrid.side{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.ftext{display:grid;gap:.9rem;align-content:start}
@media (min-width:700px){.fgrid.wide .ftext{grid-template-columns:1fr 1fr}}
.fvis h4,.ftext h4{margin:0 0 .35rem;font-size:.98rem}
.fvis .diagram{margin-top:0}
.ftext .prose p{margin:0 0 .5rem}
.fblock.caution{border-left:4px solid var(--amber);padding-left:.8rem}
.analogy{border-left:4px solid var(--teal);background:var(--teal-soft);padding:.6rem .9rem;border-radius:0 8px 8px 0}
.analogy p{margin:0}
body[data-lang="en"] .zh-only{display:none}
.dtwrap{overflow-x:auto}
.dtbl{border-collapse:collapse;width:100%;min-width:520px;font-size:.95rem}
.dtbl th,.dtbl td{padding:.5rem .65rem;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.dtbl th:first-child,.dtbl td:first-child{text-align:left;font-weight:700}
.dtbl thead th{background:var(--teal-soft);border-top:0;font-size:.84rem;white-space:nowrap}
.dtbl td.best{background:var(--amber-soft);font-weight:700}
.fvis .src{color:var(--muted);font-size:.88rem;margin:.5rem 0 0}
.timeline{list-style:none;margin:0;padding:0 0 0 1.2rem;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 .9rem 1rem}
.timeline li::before{content:"";position:absolute;left:-1.62rem;top:.3rem;width:.8rem;height:.8rem;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.timeline li.new::before{background:var(--amber);border-color:var(--amber)}
.timeline li.ref::before{background:var(--teal);border-color:var(--teal)}
.timeline .t-head{font-weight:700}
.timeline .en-p,.timeline .zh-p{margin:0}
body[data-lang="en"] .timeline .zh-p{display:none}
body[data-lang="zh"] .timeline .en-p{display:none}
body[data-lang="both"] .timeline .zh-p{color:var(--muted);font-size:.95rem}
.panels{display:grid;gap:.8rem}
@media (min-width:700px){.panels{grid-template-columns:1fr 1fr}}
.panel{border:1px solid var(--line);border-radius:10px;padding:.8rem .9rem;background:var(--bg)}
.panel .t-head{margin:0 0 .4rem;display:flex;flex-wrap:wrap;align-items:center;gap:.4rem}
.plabel{font-size:.8rem;color:var(--muted);margin:.4rem 0 .1rem}
.panel .prose p{margin:0 0 .3rem}
.evrow{display:flex;flex-wrap:wrap;gap:.4rem .6rem;align-items:center;margin-top:.5rem}
.ev{display:inline-block;border-radius:999px;padding:.08rem .6rem;font-size:.8rem;font-weight:700;border:1px solid currentColor}
.ev.claim{color:var(--amber)}
.ev.partial{color:var(--teal)}
.ev.table{color:var(--teal);background:var(--teal-soft)}
.evnote{font-size:.88rem;color:var(--muted)}
.sc-zone{fill:var(--amber-soft);opacity:.75}
.sc-zone-t{fill:var(--ink);font-weight:700}
.sc-grid{stroke:var(--line);stroke-width:1}
.sc-axis{stroke:var(--muted);stroke-width:1.4}
.sc-line{fill:none;stroke:var(--teal);stroke-width:2.2;stroke-linejoin:round}
.sc-pt{fill:var(--amber);stroke:var(--surface);stroke-width:2;cursor:pointer;transition:opacity .25s}
.sc-pt.sel{fill:var(--teal)}
.sc-pt.hide,.sc-lb.hide{opacity:0}
.sc-lb{fill:var(--ink);transition:opacity .25s;pointer-events:none}
.sc-pt:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

</style>
</head>
<body data-lang="both">
<main>
  <header>
    <h1 id="h1"></h1>
    <p class="sub" id="subtitle"></p>
    <p class="srcline" id="source"></p>
    <div class="bar">
      <div class="langs" role="group" aria-label="Language / 语言">
        <button class="chip" type="button" id="lang-en" aria-pressed="false">English</button>
        <button class="chip" type="button" id="lang-zh" aria-pressed="false">中文</button>
        <button class="chip" type="button" id="lang-both" aria-pressed="true">EN + 中文</button>
      </div>
      <label class="countwrap"><input type="checkbox" id="toggleCount" checked> <span id="countLabel"></span></label>
      <span id="stats" aria-live="polite"></span>
    </div>
  </header>
  <div id="content"></div>
  <footer id="footer"></footer>
</main>

    var right = sc.better.indexOf("right") >= 0, bottom = sc.better.indexOf("bottom") >= 0;
    var bw = 92, bh = 40, bx = right ? W - R - bw : L, by = bottom ? H - B - bh : T0;
    svgEl(svg, "rect", { x: bx, y: by, width: bw, height: bh, rx: 8 }, "sc-zone");
    var bt = svgEl(svg, "text", { x: bx + bw / 2, y: by + bh / 2 + 4, "text-anchor": "middle" }, "d-s sc-zone-t");
    var arrow = (bottom ? "\u2199" : "\u2196"); if (right) arrow = bottom ? "\u2198" : "\u2197";
  }
  xt.forEach(function(v){
    svgEl(svg, "line", { x1: X(v), y1: T0, x2: X(v), y2: H - B }, "sc-grid");
    svgEl(svg, "text", { x: X(v), y: H - B + 15, "text-anchor": "middle" }, "d-s sm", String(v));
  });
  yt.forEach(function(v){
    svgEl(svg, "line", { x1: L, y1: Y(v), x2: W - R, y2: Y(v) }, "sc-grid");
    svgEl(svg, "text", { x: L - 6, y: Y(v) + 4, "text-anchor": "end" }, "d-s sm", String(v));
  });
  svgEl(svg, "line", { x1: L, y1: H - B, x2: W - R, y2: H - B }, "sc-axis");
  svgEl(svg, "line", { x1: L, y1: T0, x2: L, y2: H - B }, "sc-axis");
  var xl = svgEl(svg, "text", { x: (L + W - R) / 2, y: H - 8, "text-anchor": "middle" }, "d-s");
  var yl = svgEl(svg, "text", { transform: "translate(13 " + ((T0 + H - B) / 2) + ") rotate(-90)", "text-anchor": "middle" }, "d-s");
  var line = svgEl(svg, "polyline", { points: "" }, "sc-line");
  var ptEls = [], lbEls = [];
  sc.points.forEach(function(p, i){
    var c = svgEl(svg, "circle", { cx: X(p.x), cy: Y(p.y), r: 7, tabindex: 0, role: "button", "aria-label": p.label }, "sc-pt");
    var lb = svgEl(svg, "text", { x: X(p.x) + 9, y: Y(p.y) + (i % 2 ? 16 : -9) }, "d-t sc-lb", p.label);
    lb.style.fontSize = "12px";
    ptEls.push(c); lbEls.push(lb);
    var pick = function(){ select(i); };
    c.addEventListener("click", pick);
    c.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
  });
  var readout = mk("p", "stage"), bReplay = mk("button", "btn ghost"); bReplay.type = "button";
  var ctl = mk("div", "anim-ctl"); ctl.appendChild(bReplay);
  fig.appendChild(ctl); fig.appendChild(readout);
  var sel = -1;
  function fmt(v, d){ return typeof d === "number" ? v.toFixed(d) : String(v); }
  function select(i){
    sel = i;
    ptEls.forEach(function(c, k){ c.classList.toggle("sel", k === i); });
    var p = sc.points[i];
    readout.textContent = p.label + ": " + sc.x.label[ui] + " " + fmt(p.x, sc.x.decimals) + (sc.x.unit ? " " + sc.x.unit : "") +
      ", " + sc.y.label[ui] + " " + fmt(p.y, sc.y.decimals) + (sc.y.unit ? " " + sc.y.unit : "");
  }
  function reveal(k){
    line.setAttribute("points", sc.points.slice(0, k + 1).map(function(p){ return X(p.x).toFixed(1) + "," + Y(p.y).toFixed(1); }).join(" "));
    ptEls.forEach(function(c, i){ c.classList.toggle("hide", i > k); lbEls[i].classList.toggle("hide", i > k); });
  }
  var timer = 0;
  function play(){
    clearInterval(timer);
    if (reduceMotion) { reveal(sc.points.length - 1); return; }
    var k = -1; reveal(-1);
    timer = setInterval(function(){ k++; reveal(k); if (k >= sc.points.length - 1) clearInterval(timer); }, 420);
  }
  bReplay.addEventListener("click", play);
  reveal(sc.points.length - 1);
  var played = false;
  if ("IntersectionObserver" in window && !reduceMotion) {
    new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting && !played) { played = true; play(); } }); }, { threshold: 0.5 }).observe(svg);
  }
  if (sc.caption) { var fc = mk("figcaption"); bil(fc, sc.caption); fig.appendChild(fc); }
  dyn.push(function(){
    tEl.textContent = sc.x.label[ui] + " / " + sc.y.label[ui];
    xl.textContent = sc.x.label[ui] + (sc.x.unit ? " (" + sc.x.unit + ")" : "") + (sc.x.better ? " " + (sc.x.better === "low" ? "\u2190" : "\u2192") : "");
    yl.textContent = sc.y.label[ui] + (sc.y.unit ? " (" + sc.y.unit + ")" : "") + (sc.y.better ? " " + (sc.y.better === "low" ? "\u2193" : "\u2191") : "");
    if (bt) bt.textContent = arrow + " " + T("better_corner");
    bReplay.textContent = T("replay");
    if (sel >= 0) select(sel); else readout.textContent = T("tap_dot");
  });
  return fig;
}

function buildDataTable(dt){
  var wrap = mk("div", "dtwrap"), table = mk("table", "dtbl"), thead = mk("thead"), tbody = mk("tbody");
  var tr = mk("tr"), ths = [];
  var th0 = mk("th"); tr.appendChild(th0);
  dt.columns.forEach(function(c){ var th = mk("th"); ths.push(th); tr.appendChild(th); });
  thead.appendChild(tr);
  var best = {};
  dt.columns.forEach(function(c){
    var vals = dt.rows.map(function(r){ return r.values[c.id]; }).filter(function(v){ return typeof v === "number"; });
    best[c.id] = c.better === "low" ? Math.min.apply(null, vals) : (c.better === "high" ? Math.max.apply(null, vals) : null);
  });
  dt.rows.forEach(function(r){
    var row = mk("tr");
    row.appendChild(mk("td", "", r.label));
    dt.columns.forEach(function(c){
      var v = r.values[c.id], td = mk("td", best[c.id] !== null && v === best[c.id] ? "best" : "");
      td.textContent = typeof v === "number" ? v.toFixed(c.decimals !== undefined ? c.decimals : 1) : "";
      row.appendChild(td);
    });
    tbody.appendChild(row);
  });
  table.appendChild(thead); table.appendChild(tbody); wrap.appendChild(table);
  var box = mk("div"); box.appendChild(wrap);
  var src = mk("p", "src"); box.appendChild(src);
  dyn.push(function(){
    th0.textContent = (dt.first && dt.first[ui]) || T("th_model");
    dt.columns.forEach(function(c, i){
      ths[i].textContent = c.label[ui] + (c.unit ? " (" + c.unit + ")" : "") + (c.better ? (c.better === "low" ? " \u2193" : " \u2191") : "");
    });
    src.textContent = T("src") + ": " + dt.source;
  });
  return box;
}

function buildTimeline(tl){
  var box = mk("div"), ol = mk("ol", "timeline");
  tl.items.forEach(function(it){
    var li = mk("li", it.mark || "");
    var head = mk("div", "t-head", it.year + "  " + it.name);
    var en = mk("div", "en-p"); sentSpans(en, it.text.en);
    var zh = mk("div", "zh-p"); zh.setAttribute("lang", "zh-CN");
    it.text.zh.forEach(function(z){ var sp = mk("span", "s"); fillInline(sp, z); zh.appendChild(sp); });
    li.appendChild(head); li.appendChild(en); li.appendChild(zh);
    ol.appendChild(li);
  });
  box.appendChild(ol);
  var src = mk("p", "src"); box.appendChild(src);
  dyn.push(function(){ src.textContent = T("src") + ": " + tl.source; });
  return box;
}

function buildPanels(pn){
  var box = mk("div"), grid = mk("div", "panels");
  pn.items.forEach(function(it){
    var panel = mk("div", "panel");
    var head = mk("div", "t-head"); head.appendChild(mk("span", "fid", it.tag)); head.appendChild(document.createTextNode(" "));
    var ttl = mk("span"); bil(ttl, it.title); head.appendChild(ttl);
    panel.appendChild(head);
    var lab1 = mk("div", "plabel"); dyn.push(function(){ lab1.textContent = T("paper_says"); });
    var c1 = mk("div", "prose");
    renderProse(c1, [it.claim]);
    var lab2 = mk("div", "plabel"); dyn.push(function(){ lab2.textContent = T("plain_words"); });
    var c2 = mk("div", "prose");
    renderProse(c2, [it.plain]);
    var ev = mk("div", "evrow"), badge = mk("span", "ev " + it.evidence.level), note = mk("span", "evnote");
    bil(note, it.evidence.note);
    ev.appendChild(badge); ev.appendChild(note);
    dyn.push(function(){ badge.textContent = T("ev_" + it.evidence.level); });
    [lab1, c1, lab2, c2, ev].forEach(function(n){ panel.appendChild(n); });
    grid.appendChild(panel);
  });
  box.appendChild(grid);
  return box;
}

var fcIdx = 0;
function blockHead(key){ var h = mk("h4"); dyn.push(function(){ h.textContent = T(key); }); return h; }
function buildFigureCard(card){
  var rd = card.redraw, wide = (card.layout === "wide") || ["datatable", "timeline", "panels"].indexOf(rd.type) >= 0;
  var art = mk("article", "fcard"); art.id = card.id || ("fig" + (fcIdx++));
  var head = mk("header", "fhead");
  head.appendChild(mk("span", "fid fid-en", card.label.en));
  var zl = mk("span", "fid fid-zh", card.label.zh); head.appendChild(zl);
  var h3 = mk("h3"); bil(h3, card.title); head.appendChild(h3);
  art.appendChild(head);

  var grid = mk("div", "fgrid " + (wide ? "wide" : "side"));
  var vis = mk("div", "fvis");
  var vh = blockHead("fig_redraw"); vis.appendChild(vh);
  var w;
  if (rd.type === "scatter") w = buildScatter(rd);
  else if (rd.type === "diagram") w = buildDiagram(rd.diagram || rd, 100 + (fcIdx++));
  else if (rd.type === "chart") w = buildChart(rd.chart || rd);
  else if (rd.type === "datatable") w = buildDataTable(rd);
  else if (rd.type === "timeline") w = buildTimeline(rd);
  else w = buildPanels(rd);
  vis.appendChild(w);
  if (card.redraw_note) { var rn = mk("p", "src"); bil(rn, card.redraw_note); vis.appendChild(rn); }

  var txt = mk("div", "ftext");
  function blk(key, para, extra){
    var b = mk("div", "fblock " + (extra || ""));
    b.appendChild(blockHead(key));
    var pr = mk("div", "prose"); renderProse(pr, [para]); b.appendChild(pr);
    txt.appendChild(b);
  }
  blk("fig_original", card.original);
  blk("fig_read", card.plain.read);
  blk("fig_meaning", card.plain.meaning);
  blk("fig_caution", card.plain.caution, "caution");
  if (card.analogy) {
    var an = mk("div", "analogy zh-only"); an.setAttribute("lang", "zh-CN");
    an.appendChild(blockHead("fig_analogy"));
    an.appendChild(mk("p", "", card.analogy.zh));
    txt.appendChild(an);
  }
  grid.appendChild(vis); grid.appendChild(txt);
  art.appendChild(grid);
  return art;
}

/* ------------------------------------------------------------ page assembly */
var h1 = document.getElementById("h1");
bil(h1, META.title || { en: "Paper explainer", zh: "论文解读" });
if (META.subtitle) bil(document.getElementById("subtitle"), META.subtitle);
else document.getElementById("subtitle").style.display = "none";

(function(){
  var s = META.source, line = document.getElementById("source");
  if (!s) { line.style.display = "none"; return; }
  var lab = mk("span"), a = mk("a", "", s.title);
  if (s.url) { a.href = s.url; a.target = "_blank"; a.rel = "noopener"; }
  var rest = mk("span", "", [s.authors, s.id, s.date].filter(Boolean).map(function(x){ return " \u00B7 " + x; }).join("").replace(/^ \u00B7 /, " \u2014 "));
  line.appendChild(lab); line.appendChild(a); line.appendChild(rest);
  dyn.push(function(){ lab.textContent = T("src") + ": "; });
})();

var content = document.getElementById("content");
var dgIdx = 0;
(DATA.sections || []).forEach(function(sec, si){
  var section = mk("section"); section.id = sec.id || ("s" + si);
  var h2 = mk("h2"); bil(h2, sec.title); section.appendChild(h2);
  var grid = mk("div", "grid" + (sec.diagram ? "" : " single"));
  var left = mk("div"), prose = mk("div", "prose");
  renderProse(prose, sec.paras || []);
  left.appendChild(prose);
  if (sec.chart) { var cw = buildChart(sec.chart); cw.style.marginTop = "1.25rem"; left.appendChild(cw); }
  grid.appendChild(left);
  if (sec.diagram) {
    var col = mk("div", "figcol");
    col.appendChild(buildDiagram(sec.diagram, dgIdx++));
    grid.appendChild(col);
  }
  section.appendChild(grid);
  content.appendChild(section);
});

var FIG = DATA.figures;
if (FIG && FIG.cards && FIG.cards.length) {
  var fsec = mk("section"); fsec.id = "figures";
  var fh2 = mk("h2"); bil(fh2, FIG.title || { en: "Core figures and tables explained", zh: "核心图表解读" });
  fsec.appendChild(fh2);
  var fintro = mk("p", "sub");
  if (FIG.intro) bil(fintro, FIG.intro); else dyn.push(function(){ fintro.textContent = T("fig_intro"); });
  fsec.appendChild(fintro);
  FIG.cards.forEach(function(card){ fsec.appendChild(buildFigureCard(card)); });
  content.appendChild(fsec);
}

var tables = DATA.tables || [];
if (tables.length || DATA.rules_table !== false) {
  var cs = mk("section"); cs.id = "concepts";
  var ch2 = mk("h2"); dyn.push(function(){ ch2.textContent = (META.concepts_title && META.concepts_title[ui]) || T("h2con"); });
  cs.appendChild(ch2);
  tables.forEach(function(t){
    var h3 = mk("h3", "tbl-h"); bil(h3, t.title); cs.appendChild(h3);
    cs.appendChild(t.kind === "compare" ? buildCompare(t) : buildGlossary(t));
  });
  if (DATA.rules_table !== false) {
    var rh = mk("h3", "tbl-h"); dyn.push(function(){ rh.textContent = T("h3rules"); });
    cs.appendChild(rh); cs.appendChild(buildRules());
  }
  content.appendChild(cs);
}

var footer = document.getElementById("footer");
var fp = [mk("p"), mk("p"), mk("p"), mk("p")];
if (!(FIG && FIG.cards && FIG.cards.length)) fp.pop();
fp.forEach(function(p){ footer.appendChild(p); });
(DATA.footer_notes || []).forEach(function(n){ var p = mk("p"); bil(p, n); footer.appendChild(p); });
dyn.push(function(){ fp[0].textContent = T("f1")(LIMIT); fp[1].textContent = T("f2"); fp[2].textContent = T("f3"); if (fp[3]) fp[3].textContent = T("f4"); });

/* ------------------------------------------------------------ language switching */
function applyLang(){
  ui = lang === "en" ? "en" : "zh";
  document.documentElement.lang = ui === "zh" ? "zh-CN" : "en";
  document.body.setAttribute("data-lang", lang);
  ["en", "zh", "both"].forEach(function(m){
    document.getElementById("lang-" + m).setAttribute("aria-pressed", m === lang ? "true" : "false");
  });
  document.getElementById("countLabel").textContent = T("countLabel");
  document.getElementById("stats").textContent = T("stats")(total, longest, LIMIT);
  Array.prototype.forEach.call(document.querySelectorAll("[data-lk]"), function(el){
    el.setAttribute("data-label", T(el.getAttribute("data-lk")));
  });
  dyn.forEach(function(f){ f(); });
}
["en", "zh", "both"].forEach(function(m){
  document.getElementById("lang-" + m).addEventListener("click", function(){ lang = m; applyLang(); });
});
document.getElementById("toggleCount").addEventListener("change", function(e){
  document.body.classList.toggle("nocount", !e.target.checked);
});
applyLang();
})();
</script>
